<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bulle &amp; Bär">
<meta name="theme-color" content="#131f24">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐂</text></svg>">
<title>Bulle &amp; Bär 🐂 – Anlageprodukte &amp; Anlageberatung</title>
<style>
:root{
  --bg:#131f24;--bg2:#1a2a31;--card:#202f36;--card2:#2a3b44;--line:#37464f;
  --text:#f1f7fb;--muted:#9fb3bf;
  --green:#58cc02;--green-d:#46a302;--blue:#1cb0f6;--blue-d:#1899d6;--red:#ff4b4b;--red-d:#d33131;
  --gold:#ffc800;--gold-d:#cc9f00;--purple:#ce82ff;--purple-d:#a257d6;--orange:#ff9600;--orange-d:#cc7800;
  --r:16px;
  font-family:"Nunito","Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;background:var(--bg);}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;overscroll-behavior-y:contain;font-size:16px;line-height:1.45;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
button,.tile,.node,.chip,summary{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
button{font-family:inherit;color:inherit;-webkit-appearance:none;appearance:none;}
input,textarea,select{-webkit-appearance:none;appearance:none;font-size:16px;}
input[type=range]{-webkit-appearance:auto;appearance:auto;}
.run-body,.prodpick,.fb-e,.flash .f1,.flash .f2{-webkit-overflow-scrolling:touch;}
h1,h2,h3,h4{margin:0 0 6px;}
b,strong{color:#fff;}
.muted{color:var(--muted);}
.hidden{display:none!important;}

/* HUD */
#hud{position:sticky;top:0;z-index:40;background:rgba(19,31,36,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:2px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;}
.hud-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;justify-content:space-between;}
.chip{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.95rem;padding:4px 8px;border-radius:12px;cursor:pointer;white-space:nowrap;}
.chip.fire{color:var(--orange);}.chip.xp{color:var(--gold);}.chip.cd{color:var(--blue);}
.ring{--p:0;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;}
.ring i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:.8rem;}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom));}

/* NAV */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
#nav .in{display:flex;width:100%;max-width:760px;}
#nav button{flex:1;background:none;border:none;padding:8px 2px 6px;font-size:.68rem;font-weight:800;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;text-transform:uppercase;letter-spacing:.3px;}
#nav button span{font-size:1.45rem;filter:grayscale(.8);opacity:.8;}
#nav button.on{color:var(--blue);}
#nav button.on span{filter:none;opacity:1;transform:scale(1.1);}

/* Buttons */
.btn{border:none;border-radius:14px;padding:13px 18px;font-weight:900;font-size:1rem;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:transform .08s, box-shadow .08s;touch-action:manipulation;}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-d);color:#0b2300;}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d);color:#00263a;}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d);color:#3a0000;}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#3a2d00;}
.btn.purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-d);color:#2a0046;}
.btn.ghost{background:var(--card);box-shadow:0 4px 0 var(--line);color:var(--blue);border:2px solid var(--line);padding:11px 16px;}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 transparent;}
.btn:disabled{background:var(--card2);box-shadow:none;color:#6b7f8b;cursor:not-allowed;}
.btn.full{width:100%;}
.btn.sm{padding:8px 12px;font-size:.8rem;border-radius:10px;}

/* Cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;}
.card h3{font-size:1.1rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.tile{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .1s;text-align:left;}
.tile:active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px;}
.tile .ic{font-size:2rem;}
.tile h4{font-size:1.02rem;margin:0;}
.tile p{margin:0;color:var(--muted);font-size:.85rem;}
.tile .meta{font-size:.78rem;color:var(--gold);font-weight:800;margin-top:auto;padding-top:4px;}
.hero{background:linear-gradient(135deg,#1d4d61,#17323d);border:2px solid #2c6c86;border-radius:var(--r);padding:16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;}
.hero .mascot{font-size:3rem;line-height:1;}
.hero h2{font-size:1.2rem;}
.bar{height:12px;background:var(--bg);border-radius:99px;overflow:hidden;border:2px solid var(--line);}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s;}
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:3px;margin-bottom:12px;gap:3px;}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:9px 4px;font-weight:800;font-size:.85rem;color:var(--muted);cursor:pointer;}
.seg button.on{background:var(--blue);color:#00263a;}
h2.sec{margin:18px 0 8px;font-size:1.15rem;}

/* PATH */
.unit{margin-bottom:26px;}
.unit-head{border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35);}
.unit-head .ic{font-size:2.2rem;}
.unit-head h3{margin:0;font-size:1.1rem;}
.unit-head p{margin:0;font-size:.82rem;opacity:.9;}
.unit-head .sp{margin-left:auto;}
.nodes{display:flex;flex-direction:column;align-items:center;gap:34px;padding:22px 0 8px;}
.node{position:relative;width:78px;height:72px;border-radius:50%/48%;border:none;font-size:1.8rem;cursor:pointer;color:#fff;background:var(--c);box-shadow:0 7px 0 var(--cd);transition:transform .08s,box-shadow .08s;}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--cd);}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d);}
.node.cur::after{content:"";position:absolute;inset:-9px;border:5px solid var(--c);border-radius:50%/48%;opacity:.5;animation:pulse 1.4s infinite;}
.node .st{position:absolute;bottom:-17px;left:0;right:0;font-size:.75rem;letter-spacing:1px;}
.node.boss{width:92px;height:84px;font-size:2.2rem;background:var(--purple);box-shadow:0 8px 0 var(--purple-d);}
.node.boss.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-d);}
.start-bub{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#fff;color:var(--c);font-weight:900;font-size:.8rem;padding:3px 10px;border-radius:10px;animation:bob 1s infinite alternate;white-space:nowrap;}
.start-bub::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0;}
@keyframes pulse{from{transform:scale(1);opacity:.6}to{transform:scale(1.18);opacity:0}}
@keyframes bob{from{transform:translate(-50%,0)}to{transform:translate(-50%,-4px)}}

/* OVERLAY / RUNNER */
#overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
.run-top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 8px;max-width:760px;width:100%;margin:0 auto;}
.run-top .x{background:none;border:none;color:var(--muted);font-size:1.6rem;cursor:pointer;}
.run-top .bar{flex:1;}
.run-top .hearts{font-weight:900;color:var(--red);font-size:1.1rem;white-space:nowrap;}
.run-top .tm{font-weight:900;color:var(--blue);min-width:48px;text-align:right;}
.run-body{flex:1;overflow-y:auto;padding:8px 16px 20px;max-width:760px;width:100%;margin:0 auto;}
.run-q{font-size:1.25rem;font-weight:800;margin:6px 0 16px;line-height:1.35;}
.run-type{font-size:.75rem;color:var(--purple);text-transform:uppercase;letter-spacing:1px;font-weight:900;margin-bottom:2px;}
.ctx{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:12px;margin-bottom:12px;font-size:.95rem;}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:13px 14px;margin-bottom:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .06s;}
.opt:active{transform:translateY(2px);}
.opt.sel{border-color:var(--blue);background:#143a4d;color:#dff4ff;}
.opt.ok{border-color:var(--green);background:#1f3d12;}
.opt.bad{border-color:var(--red);background:#4a1b1b;}
.opt.dim{opacity:.55;}
.opt .k{display:inline-block;width:26px;height:26px;line-height:22px;text-align:center;border:2px solid var(--line);border-radius:8px;margin-right:10px;font-size:.8rem;color:var(--muted);}
.tfrow{display:flex;gap:12px;}.tfrow .opt{text-align:center;font-size:1.15rem;padding:22px 8px;}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pairs .opt{margin:0;padding:11px 10px;font-size:.92rem;}
.pairs .p0{border-color:#1cb0f6}.pairs .p1{border-color:#ffc800}.pairs .p2{border-color:#ce82ff}.pairs .p3{border-color:#ff9600}.pairs .p4{border-color:#58cc02}.pairs .p5{border-color:#ff6b9d}
.pairs .opt.tmp{border-color:#fff;background:#2a3b44;}
.slot{min-height:54px;border:2px dashed var(--line);border-radius:14px;padding:8px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px;}
.slot .opt{margin:0;padding:9px 12px;font-size:.92rem;}
.pool{display:flex;flex-wrap:wrap;gap:8px;}.pool .opt{width:auto;margin:0;padding:9px 12px;font-size:.92rem;}
.numin{display:flex;align-items:center;gap:8px;}
.numin input{flex:1;font-size:1.5rem;font-weight:800;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:#fff;font-family:inherit;min-width:0;}
.numin input:focus{outline:none;border-color:var(--blue);}
.numin span{font-weight:800;color:var(--muted);}
.run-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:2px solid var(--line);}
.run-foot .in{max-width:760px;margin:0 auto;}
.run-foot.ok{background:#1b3a0e;border-color:#2d6a12;}
.run-foot.bad{background:#411818;border-color:#7a2a2a;}
.fb-t{font-size:1.15rem;font-weight:900;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.run-foot.ok .fb-t{color:var(--green);}.run-foot.bad .fb-t{color:var(--red);}
.fb-e{font-size:.92rem;margin-bottom:10px;max-height:34vh;overflow-y:auto;}
.fb-e .sol{background:rgba(0,0,0,.25);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:.88rem;}

/* Cards viewer */
.lcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;min-height:240px;}
.lcard h3{font-size:1.3rem;color:var(--gold);}
.lcard ul{padding-left:20px;margin:6px 0;}.lcard li{margin:4px 0;}
.lcard table,.sheet table{border-collapse:collapse;width:100%;font-size:.88rem;margin:8px 0;}
.lcard td,.lcard th,.sheet td,.sheet th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top;}
.lcard th,.sheet th{background:var(--card2);}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0;}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);}.dots i.on{background:var(--blue);}
.tip{background:#2a2410;border-left:4px solid var(--gold);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:.9rem;}
.warn{background:#34171a;border-left:4px solid var(--red);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:.9rem;}
code,.f{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0f191d;padding:1px 6px;border-radius:6px;font-size:.88em;color:#bde6ff;}

/* Result */
.res{text-align:center;padding-top:6vh;}
.res .big{font-size:4.5rem;}
.res h2{font-size:1.6rem;}
.stars{font-size:2.4rem;letter-spacing:6px;margin:6px 0;}
.stats{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap;}
.stat{border:2px solid var(--line);border-radius:14px;padding:8px 14px;min-width:96px;}
.stat b{display:block;font-size:1.3rem;}.stat small{color:var(--muted);font-weight:800;text-transform:uppercase;font-size:.65rem;}

/* Flashcard */
.flash{perspective:900px;height:300px;margin:10px 0 16px;cursor:pointer;}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;}
.flash.flip .in{transform:rotateY(180deg);}
.flash .f1,.flash .f2{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:2px solid var(--line);padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow-y:auto;}
.flash .f1{background:linear-gradient(135deg,#24424f,#1a2f38);font-size:1.5rem;font-weight:900;}
.flash .f2{background:#2a2b4a;transform:rotateY(180deg);font-size:1.05rem;border-color:#5a5cab;}
.flash small{color:var(--muted);font-weight:800;margin-top:12px;font-size:.75rem;}
.boxes{display:flex;gap:6px;justify-content:center;margin-bottom:8px;}.boxes i{width:34px;height:8px;border-radius:5px;background:var(--line);}.boxes i.on{background:var(--green);}

/* Studio */
.studio svg{width:100%;height:auto;background:#0f191d;border:2px solid var(--line);border-radius:14px;display:block;}
.stk{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:10;background:var(--bg);padding:4px 0 2px;}
.stk .readout{margin:6px 0 4px;padding:8px 12px;}
.stk .tip{margin:4px 0 0;padding:4px 8px;font-size:.82rem;}
.sl{margin:10px 0;}.sl label{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem;}
.sl input[type=range]{width:100%;accent-color:var(--green);height:30px;}
.prodpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;}
.prodpick button{flex:0 0 auto;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:800;font-size:.82rem;cursor:pointer;white-space:nowrap;}
.prodpick button.on{border-color:var(--green);background:#1f3d12;}
.readout{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;}
.readout .r1{font-size:1.15rem;font-weight:900;}
.pos{color:var(--green);}.neg{color:var(--red);}

/* Misc */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;}
.badge{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 6px;font-size:.72rem;}
.badge .bi{font-size:2rem;display:block;}
.badge.lock{opacity:.35;filter:grayscale(1);}
details.sheet{background:var(--card);border:2px solid var(--line);border-radius:14px;margin-bottom:10px;}
details.sheet summary{padding:12px;font-weight:900;cursor:pointer;list-style:none;}
details.sheet .cnt{padding:0 14px 12px;}
details.sheet h4{color:var(--gold);margin:10px 0 2px;}
input.search,input.txt,select.txt{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:#fff;font-size:1rem;font-family:inherit;margin-bottom:10px;}
.gl{padding:10px 0;border-bottom:1px solid var(--line);}.gl b{color:var(--gold);}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-140%);z-index:100;background:#fff;color:#111;font-weight:900;padding:10px 18px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.5);transition:transform .35s;max-width:92vw;text-align:center;}
#toast.show{transform:translate(-50%,0);}
#sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;}
#sheet .pane{background:var(--bg2);border-top:3px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:760px;animation:up .25s;}
@keyframes up{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
#confetti{position:fixed;inset:0;z-index:120;pointer-events:none;}
.right{float:right;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.mt{margin-top:12px;}
.tag{display:inline-block;font-size:.7rem;font-weight:900;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
@media (max-width:420px){.chip{font-size:.85rem;padding:3px 5px;}.run-q{font-size:1.12rem;}}
</style>
</head>
<body>
<header id="hud"><div class="hud-in" id="hudin"></div></header>
<main id="main"></main>
<nav id="nav"><div class="in" id="navin"></div></nav>
<div id="overlay" class="hidden"></div>
<div id="sheet" class="hidden"></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>
<script>
"use strict";
/* ============ DATEN-HELFER ============ */
const UNITS=[],FLASH=[],SCEN=[];
// MC: erste Option ist die richtige (wird zur Laufzeit gemischt)
const MC=(q,o,e)=>({t:'mc',q,o,e});
const SC=(ctx,q,o,e)=>({t:'mc',ctx,q,o,e});
const TF=(q,a,e)=>({t:'tf',q,a,e});
const MS=(q,ok,bad,e)=>({t:'ms',q,ok,bad,e});
const MA=(q,p,e)=>({t:'ma',q,p,e});
const OR=(q,items,e)=>({t:'or',q,items,e});
const NU=(q,a,tol,unit,e)=>({t:'nu',q,a,tol,unit,e});
const card=(h,b)=>({h,b});
const U=(o)=>UNITS.push(o);
/* ============ UNIT 1 ============ */
U({id:'u1',icon:'📜',title:'Wertpapiere & Finanzmärkte',sub:'Grundbegriffe · Kassa vs. Termin',lessons:[
{t:'Das Wertpapier',cards:[
card('Was ist ein Wertpapier?',`<ul><li>Eine <b>Urkunde</b>, in der ein <b>privates Vermögensrecht</b> verkörpert ist</li><li>Zur Geltendmachung des Rechts ist der <b>Besitz der Urkunde</b> erforderlich</li></ul><p><b>3 Funktionen:</b></p><ul><li><b>Legitimation</b> – der Besitzer gilt als berechtigt</li><li><b>Transport</b> (Übertragbarkeit) – Recht wird einfach übertragen</li><li><b>Publizität</b> – Recht wird nach außen sichtbar &amp; handelbar</li></ul>`),
card('Klassifikation nach Übertragung',`<table><tr><th>Art</th><th>Übertragung</th><th>Beispiel</th></tr><tr><td><b>Inhaberpapier</b></td><td>Einigung + Übergabe</td><td>Inhaberanleihe (hohe Fungibilität)</td></tr><tr><td><b>Orderpapier</b></td><td>Indossament + Übergabe</td><td>Wechsel</td></tr><tr><td><b>Namenspapier</b> (Rektapapier)</td><td>Abtretung (Zession)</td><td>Namensschuldverschreibung</td></tr></table><p>Nach dem <b>verbrieften Recht</b>: Beteiligungspapiere (Aktie), Forderungspapiere (Anleihe), derivative Wertpapiere (Option, Zertifikat) – dazu Mischformen.</p>`),
card('Vom Papier zum Bildschirm',`<ul><li><b>Globalurkunde</b>: eine Urkunde für viele Anleger</li><li><b>Girosammelverwahrung</b> über Zentralverwahrer</li><li><b>Elektronische Wertpapiere</b> (eWpG)</li></ul><div class="tip">Die Verkörperung tritt zurück – die <b>Funktion</b> bleibt bestehen.</div>`)],

{t:'Bewertung & Analyse',cards:[
card('Kennzahlen',`<ul><li><b>KGV</b> = Kurs ÷ Gewinn je Aktie (Ø Deutschland ≈ 16) – Vergleich nur <b>innerhalb der Branche</b>; Problem bei Verlustfirmen</li><li><b>Dividendenrendite</b> = Dividende je Aktie ÷ Kurs</li><li><b>KCF</b> = Kurs ÷ Cash Flow je Aktie – weniger <b>manipulationsanfällig</b></li><li><b>Bilanzkurs</b> = bilanzieller Substanzwert (Eigenkapital je Aktie)</li><li><b>Ertragswertkurs</b> = Barwert aller erwarteten Rückflüsse (Dividenden- oder Gewinnmodell)</li></ul><div class="tip">Niedriges KGV/KCF und hohe Dividendenrendite → gelten als „kaufenswert“.</div>`),
card('Fundamental vs. technisch',`<ul><li><b>Fundamentalanalyse:</b> Kurs schwankt um den <b>inneren Wert</b> (Summe diskontierter künftiger Zahlungen). <i>Top-down:</i> Global → Branche → Unternehmen. <i>Bottom-up:</i> Einzelaktien → Aggregation.</li><li><b>Technische Analyse:</b> Kursverlaufsmuster (Trendlinien, gleitende Durchschnitte, Unterstützung). Beantwortet <b>„Wann?“</b>, nicht „Wie viel ist die Aktie wert?“. Kritik: nicht theoretisch fundiert, Random-Walk.</li></ul><p><b>Charts:</b> Linie (Schlusskurse) · Balken (Open/High/Low/Close) · <b>Candlestick</b>: Körper = Eröffnung↔Schluss; Schluss &gt; Eröffnung → unausgefüllt (häufig grün), Schluss &lt; Eröffnung → ausgefüllt (häufig rot); Schatten = Schwankungsbreite.</p><p><b>Sentiment</b> (Stimmung, z. B. Euwax-Sentiment, Börse-Frankfurt-Sentiment, Put-Call-Ratio) wirkt oft als <b>Kontraindikator</b>: Euphorie → möglicher Top, Angst → möglicher Boden.</p>`)],
qs:[
NU('Kurs 90 €, Gewinn je Aktie 6 €. Wie hoch ist das KGV?',15,0.01,'','KGV = 90 ÷ 6 = 15.'),
NU('Dividende 2,40 €, Aktienkurs 60 €. Dividendenrendite?',4,0.01,'%','2,40 ÷ 60 = 4 %.'),
MC('Wann gelten Aktien nach den Kennzahlen als „kaufenswert“?',['Niedriges KGV/KCF und hohe Dividendenrendite','Hohes KGV und niedrige Dividendenrendite','Negativer Gewinn','Hoher Kurs'],'Günstige Bewertung = wenig Kurs pro Euro Gewinn/Cash Flow.'),
MC('Warum gilt der Cash Flow als aussagekräftiger als der Gewinn?',['Er ist weniger anfällig für bilanzpolitische Manipulation','Er ist immer höher','Er ignoriert Investitionen','Er wird von der BaFin geprüft'],'Daher das Kurs-Cash-Flow-Verhältnis (KCF).'),
MA('Ordne Ansatz und Idee zu.',[['Fundamentalanalyse','Innerer Wert = Barwert künftiger Zahlungen'],['Technische Analyse','Kursverlaufsmuster / Charts'],['Top-down','Global → Branche → Unternehmen'],['Bottom-up','Einzelaktien → Gesamtmarkt']],'Beide Ansätze werden in der Praxis genutzt; Bottom-up ist arbeitsintensiver.'),
MC('Im Candlestick-Chart endet eine Periode mit Schlusskurs ÜBER dem Eröffnungskurs. Der Körper ist …',['unausgefüllt (häufig grün)','ausgefüllt (häufig rot)','nur ein Strich','nicht definiert'],'Ausgefüllt/rot = Schluss unter Eröffnung.'),
MC('Der Sentiment-Index wird oft verwendet als …',['Kontraindikator','Garant für Kursanstiege','Maß für das KGV','Zinsprognose'],'Extreme Euphorie → möglicher Markttop; extreme Angst → mögliches Markttief.'),
TF('Die technische Analyse beantwortet die Frage „Wie viel ist die Aktie wert?“.',false,'Sie beantwortet „Wann ist ein günstiger Zeitpunkt zum Kaufen/Verkaufen?“.'),
MC('Der Bilanzkurs verdeutlicht …',['den bilanziellen Substanzwert je Aktie (Eigenkapital ÷ Aktien)','den Barwert künftiger Dividenden','die Kursuntergrenze laut Börse','die Rendite der Anleihe'],'Ertragswertkurs dagegen = Barwert der Rückflüsse.'),
TF('KGV-Vergleiche sind nur zwischen Firmen derselben Branche sinnvoll.',true,'Zudem eingeschränkt bei Turn-around-Situationen und unterschiedlichen Bilanzierungsarten.')]}
]});

{t:'Rendite & Zerobond-Zinsen',cards:[
card('Yield to Maturity',`<p>Die <b>Rendite</b> (YTM) ist der <b>interne Zinsfuß</b>: Mit ihr diskontiert, entspricht der Barwert aller Rückflüsse dem Marktwert.</p><p class="f">MW = Σ CF<sub>t</sub> / (1+R)<sup>t</sup></p><p><i>Bsp.: 3 J., Kupon 4 %, 1 Mio €, MW 920.321,43 € → <b>R = 7,0383 %</b></i></p><div class="tip">Kupon &lt; Rendite ⇒ Kurs <b>unter pari</b>.</div>`),
card('Anleihespezifische Rendite vs. Nullkuponzins',`<ul><li>Jede Anleihe hat <b>eigene</b> Rendite (Beispiel: 7,0383 % / 6,0145 % / 5,0000 %) – gleichzeitige Zahlungen werden unterschiedlich diskontiert.</li><li><b>Periodenspezifische Nullkuponzinssätze</b> (Zerobondrenditen: 5,0000 % / 6,0303 % / 7,0969 %) erlauben die <b>eindeutige</b> Bewertung einer Zahlung.</li><li>Marktwert einer Anleihe = Σ CF<sub>t</sub> / (1+z<sub>t</sub>)<sup>t</sup></li><li>Zerobond-Preis = Nennwert / (1+z<sub>n</sub>)<sup>n</sup></li></ul><div class="tip">Bei einer 1-jährigen Anleihe gilt: z<sub>1</sub> = YTM<sub>1</sub>. Höhere z<sub>t</sub> berechnet man „von vorne nach hinten“ (Bootstrapping).</div>`)],

U({id:'u5',icon:'⏱️',title:'Zinsrisiko & Duration',sub:'Macaulay · Modified Duration · Kritik',lessons:[
{t:'Macaulay-Duration',cards:[
card('Definition',`<p class="f">D = Σ t · CF<sub>t</sub>/(1+R)<sup>t</sup> ÷ MW<sub>0</sub></p><ul><li>Zeitraumkennzahl in <b>Jahren</b></li><li><b>durchschnittliche Kapitalbindungsdauer</b> / „Schwerpunkt“ der Zahlungsströme</li><li>Bsp.: 10 J., Kupon 6 %, Rendite 3,754 % → <b>D = 8,002 Jahre</b> (MW 1.184,42)</li></ul>`),
card('Eigenschaften',`<ul><li><b>Zerobond:</b> D = Laufzeit</li><li><b>Kuponanleihe:</b> D <b>&lt;</b> Laufzeit (Zinszahlungen kommen früher)</li><li>D sinkt bei <b>höherem Nominalzins</b>, <b>höherer Rendite</b> und <b>früherer Tilgung</b></li><li>Zum Zeitpunkt t = D ist der Marktwert <b>unabhängig</b> von einer Renditeänderung (Immunisierung)</li></ul>`)],
qs:[
NU('Wie hoch ist die Macaulay-Duration eines Zerobonds mit 7 Jahren Restlaufzeit?',7,0,'Jahre','Beim Zerobond gibt es nur eine Zahlung – D = Laufzeit.'),
TF('Die Duration einer Kuponanleihe ist immer kleiner als ihre Restlaufzeit.',true,'Die Zinszahlungen ziehen den Schwerpunkt der Zahlungen nach vorn.'),
MS('Wann sinkt die Duration (bei gleicher Laufzeit)?',['Höherer Nominalzins','Höhere Marktrendite','Frühere Tilgung'],['Niedrigerer Nominalzins','Längere Laufzeit'],'Je früher/mehr Geld zurückfließt, desto kürzer die durchschnittliche Kapitalbindung.'),
NU('Anleihe: Nominal 100, Kupon 5 %, 2 Jahre, Rendite 5 % (MW = 100). Macaulay-Duration?',1.9524,0.01,'Jahre','D = (1·4,762 + 2·95,238) ÷ 100 = 1,952 Jahre.'),
MC('Ökonomisch beschreibt die Duration …',['die durchschnittliche Kapitalbindungsdauer einer Anleihe','die Restlaufzeit','den Kupon','die Bonität'],'Der „Schwerpunkt“ der Zahlungsströme auf der Zeitachse.'),
MC('Warum reagiert ein Zerobond stärker auf Zinsänderungen als eine Kuponanleihe gleicher Laufzeit?',['Er hat die längere Duration','Er hat das schlechtere Rating','Er hat den höheren Kupon','Er ist steuerpflichtig'],'Höhere Duration = höhere Zinssensitivität.')]},

{t:'Modified Duration & Kritik',cards:[
card('Modified Duration',`<p class="f">MD = D ÷ (1 + R)</p><p>Näherung der <b>prozentualen Marktwertänderung</b> bei Renditeänderung:</p><p class="f">ΔMW/MW ≈ − MD · ΔR</p><p>Absolut: <span class="f">ΔMW ≈ − MD · MW · ΔR</span></p><p><i>Bsp.: MD 7,7 → +1 %-Punkt Rendite ⇒ Marktwert ca. −7,7 %.</i></p>`),
card('Kritik an der Modified Duration',`<ul><li>unterstellt implizit eine <b>horizontale Zinskurve</b> (= Rendite der Anleihe)</li><li>bildet nur <b>Parallelverschiebungen</b> der Zinskurve ab</li><li><b>Approximationsfehler</b> (Duration ist nur eine lineare Näherung – Konvexität)</li></ul>`)],
qs:[

MS('Welche Kritikpunkte gelten für die Modified Duration?',['Sie unterstellt eine horizontale Zinskurve','Sie erfasst nur Parallelverschiebungen der Zinskurve','Sie ist eine Näherung (Approximationsfehler)'],['Sie gilt nur für Aktien','Sie setzt den Ausfall des Emittenten voraus'],'Die drei klassischen Kritikpunkte.'),
TF('Je höher die Duration, desto höher die Zinssensitivität des Marktwerts.',true,'Die Modified Duration misst genau diese Sensitivität.'),
MC('Fallstudie: Warum hat ein 5-jähriger Zerobond eine höhere Duration als eine 5-jährige Kuponanleihe?',['Bei der Kuponanleihe fließt vorab Geld zurück – der Zahlungsschwerpunkt liegt früher','Der Zerobond hat einen höheren Kupon','Die Kuponanleihe hat eine längere Laufzeit','Der Zerobond wird nicht besteuert'],'Zerobond: D = 5; Kuponanleihe 2,5 %: D ≈ 4,77.'),
MC('Ein Anleger erwartet FALLENDE Zinsen. Welche Anleihe profitiert am stärksten?',['Lange Laufzeit, niedriger Kupon (hohe Duration)','Kurze Laufzeit, hoher Kupon','Floating Rate Note','Geldmarktkonto'],'Hohe Duration = hoher Kursgewinn bei Zinsrückgang.')]}
]});

card('Discountzertifikat',`<ul><li>Kauf <b>unter</b> dem Kurs des Basiswerts (<b>Discount</b>) – im Gegenzug <b>Cap</b> = Gewinnbegrenzung</li><li class="f">Discount = (Aktienkurs − Preis) ÷ Aktienkurs</li><li class="f">Max.-Rendite = (Cap − Preis) ÷ Preis (p. a. × 365/Tage)</li><li>Rückzahlung: Kurs ≥ Cap → <b>Cap</b>; Kurs &lt; Cap → <b>Basiswertkurs</b> (Cash) bzw. Aktienlieferung</li><li>Verlust erst, wenn Kurs unter dem <b>Einstiegspreis</b> – Discount ist ein begrenzter Puffer</li><li>Erwartung: <b>seitwärts / leicht steigend</b>; Laufzeit 3 M – 3 J</li></ul><p><i>Bsp.: Aktie 50, Cap 50, Preis 45 → Discount 10 %, Max.-Rendite 11,1 %</i></p>`)],
qs:[
NU('DAX-Zertifikat, Bezugsverhältnis 1:100, Indexstand 7.000. Preis des Zertifikats?',70,0,'€','7.000 × 0,01 = 70 €.'),
MC('Welcher Index berücksichtigt Dividenden (Reinvestition)?',['Performanceindex (z. B. DAX)','Preisindex (z. B. Euro Stoxx 50)','Beide nicht','Nur Branchenindizes'],'Beim Preisindex fehlt die Dividende – wichtig für langfristige Anleger.'),
NU('Aktie 50 €, Discountzertifikat 45 € (Cap 50 €). Discount in %?',10,0.01,'%','(50 − 45) ÷ 50 = 10 %.'),
NU('Gleiche Daten, Laufzeit genau 1 Jahr: Maximalrendite in % (Cap 50 €, Preis 45 €)?',11.1,0.1,'%','(50 − 45) ÷ 45 = 11,1 %.'),
NU('Discountzertifikat, Cap 50 €. Der Basiswert steht am Bewertungstag bei 55 €. Rückzahlung?',50,0,'€','Rückzahlung maximal der Höchstbetrag = Cap.'),
NU('Gleiches Zertifikat (Preis 45 €), Basiswert am Bewertungstag bei 42 €. Rückzahlung?',42,0,'€','Rückzahlung = Basiswertkurs (42 €) → Verlust 3 € gegenüber Einstieg, aber weniger als bei der Aktie (−8 €).'),
MC('Ab wann entsteht beim Discountzertifikat ein Verlust?',['Wenn der Basiswert am Bewertungstag unter dem Einstiegspreis des Zertifikats schließt','Sobald der Basiswert fällt','Sobald der Cap erreicht wird','Nie'],'Der Discount ist ein begrenzter Risikopuffer.'),

{t:'Bonus & Express',cards:[
card('Bonuszertifikat',`<ul><li>Bonuslevel + <b>Barriere</b> (kontinuierlich beobachtet)</li><li>Barriere <b>nie berührt</b> → mindestens <b>Bonusbetrag</b>, darüber <b>1:1</b> (kein Cap bei klassischen Bonus)</li><li>Barriere <b>berührt</b> → Bonus entfällt, Zertifikat verhält sich <b>wie der Basiswert (1:1)</b>, ohne Dividenden</li><li class="f">Abstand zur Barriere = (Kurs − Barriere) ÷ Kurs</li><li class="f">Seitwärtsrendite p. a. = (Bonus − Preis) ÷ Preis × 365/Tage</li></ul><p><i>Bsp.: Aktie 50, Bonus 60, Barriere 35, 2 Jahre → Abstand 30 %, Seitwärtsrendite 10 % p. a.</i></p><div class="tip">Je höher der Abstand zur Barriere, desto niedriger meist die Rendite.</div>`),
card('Expresszertifikat',`<ul><li>An <b>Bewertungstagen</b>: Basiswert ≥ <b>Auszahlungslevel</b> → <b>vorzeitige Rückzahlung</b> = Nennwert + (kumulierte) <b>Express-Zahlung</b></li><li>Sonst läuft das Zertifikat weiter; Express-Zahlungen <b>kumulieren</b> (1075 → 1150 → 1225 bei 7,5 % p. a.)</li><li>Finaler Tag: ≥ Auszahlungslevel → Maximum · zwischen Barriere und Level → <b>Nennwert</b> · ≤ <b>Barriere</b> → prozentuale <b>Verluste wie Basiswert</b></li><li>Barriere nur am <b>finalen Bewertungstag</b> aktiv!</li><li>Maximalrendite bekannt, <b>keine</b> Teilnahme an Kursgewinnen/Dividenden</li><li>Erwartung: seitwärts / leicht steigend; Laufzeit 1–8 J.</li></ul>`)],

MC('Was passiert beim Bonuszertifikat, wenn die Barriere einmal verletzt wurde?',['Bonus entfällt – Zertifikat folgt dem Basiswert 1:1','Zertifikat verfällt wertlos','Bonus wird verdoppelt','Nichts'],'Auch eine kurzfristige Berührung genügt.'),

card('Hebel &amp; Knock-Out',`<ul><li><b>Hebel</b> = Reaktion des Produkts relativ zum Basiswert &gt; 1 – wirkt in <b>beide</b> Richtungen</li><li><b>Long-Knock-Out:</b> Basispreis (Finanzierungslevel) + <b>KO-Schwelle</b>; Preis ≈ (Kurs − Basispreis) × Bezugsverhältnis; wird die Schwelle berührt, <b>verfällt</b> das Produkt (Totalverlust bzw. Restwert)</li><li class="f">Hebel ≈ Kurs Basiswert ÷ Preis (bei BV 1)</li><li><b>Faktor-Zertifikat:</b> <b>täglich</b> konstanter Hebel (2–10), <b>pfadabhängig</b>, in volatilen Seitwärtsphasen ungünstig, Preis kann gegen null laufen</li><li><b>Optionsscheine</b> (Call/Put): Hebel, aber Zeitwertverfall</li></ul><p><b>Anlage- vs. Hebelprodukte:</b> Anlage = Vermögensaufbau/Renditeoptimierung, moderates Risiko · Hebel = kurzfristige Spekulation, überproportionale Verluste bis Totalverlust.</p>`)],
qs:[
MC('Was geschieht bei einem Long-Knock-Out-Produkt, wenn die KO-Schwelle berührt wird?',['Es verfällt (Totalverlust bzw. Restwert)','Es wird verdoppelt','Es wird in ein Bonuszertifikat getauscht','Nichts'],'Genau deshalb sind KO-Produkte Hebelprodukte mit höchstem Risiko.'),
NU('Long-KO: Aktie 50 €, Basispreis 45 €, Bezugsverhältnis 1. Hebel (Kurs ÷ Preis)?',10,0,'','Preis = 50 − 45 = 5 €; Hebel = 50 ÷ 5 = 10.'),

TF('Der Hebel wirkt nur bei steigenden Kursen.',false,'Hebel verstärkt Gewinne UND Verluste.'),
MC('Faktor-Zertifikate …',['bilden die tägliche Wertentwicklung gehebelt ab (Pfadabhängigkeit)','garantieren das Kapital','haben keinen Hebel','sind steuerfrei'],'Bei volatilen Seitwärtsbewegungen entsteht ein negativer kumulativer Effekt.'),
MC('Hebelprodukte eignen sich für …',['sehr erfahrene, risikobereite Anleger mit klarer kurzfristiger Meinung','sicherheitsorientierte Sparer','Altersvorsorge','Anleger ohne Verlusttragfähigkeit'],'Kurzfristige Spekulation/Trading.'),
MC('Ein Hebelprodukt hat typischerweise einen Hebel …',['größer als 1','kleiner als 1','genau 1','von 0'],'Hebel < 1: Absicherung; = 1: Partizipation; > 1: Spekulation.')]},

{t:'Risiken & Handel',cards:[

const rankIdx=xp=>{let r=0;RANKS.forEach((x,i)=>{if(xp>=x[0])r=i;});return r;};
function addXp(n){
  const before=rankIdx(S.xp),t=dkey();
  if(S.lastDay!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=(S.lastDay===dkey(y))?S.streak+1:1;S.lastDay=t;}
  S.xp+=n;S.dayXp[t]=(S.dayXp[t]||0)+n;
  const h=new Date().getHours();if(h>=22||h<5)S.flags.night=1;if(h>=5&&h<8)S.flags.early=1;
  save();
  const after=rankIdx(S.xp);
  if(after>before){setTimeout(()=>{toast('Aufstieg: '+RANKS[after][2]+' '+RANKS[after][1]+'!');sfx('lvl');confetti();},600);}
}

let AC=null;
// iOS startet den AudioContext gesperrt; erst nach einer Berührung freischalten
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=='running')AC.resume();}catch(e){}}
['touchend','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
function tone(f,d,type,delay,vol){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;const t=AC.currentTime+(delay||0);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}}
function sfx(k){if(k==='ok'){tone(660,.12,'triangle');tone(880,.18,'triangle',.1);}else if(k==='bad'){tone(220,.25,'sawtooth',0,.1);tone(165,.3,'sawtooth',.12,.1);}else if(k==='lvl'||k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',i*.12));}else if(k==='tick'){tone(900,.04,'square',0,.04);}if(navigator.vibrate&&S.sound){navigator.vibrate(k==='bad'?[60,40,60]:k==='ok'?15:[20,30,20]);}}
function confetti(){const c=$('#confetti');const ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#ce82ff','#ff9600'];const P=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:pick(cols),a:Math.random()*6}));let f=0;(function step(){ctx.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});if(++f<110)requestAnimationFrame(step);else ctx.clearRect(0,0,c.width,c.height);})();}

      const st=S.prog[lessonKey(ui,li)]||0,cur=nx&&nx[0]===ui&&nx[1]===li;
      h+=`<div style="transform:translateX(${off[li%8]}px);position:relative"><button class="node ${st?'done':''} ${cur?'cur':''}" onclick="openLesson(${ui},${li})">${cur?'<span class="start-bub">START</span>':''}${st?'✓':(li+1)}<span class="st">${st?'★'.repeat(st)+'<span style="opacity:.3">'+'★'.repeat(3-st)+'</span>':''}</span></button></div>`;
    });

    h+='</div></div>';
  });

function qType(q){return{mc:q.ctx?'Beratungsfall':'Single Choice',tf:'Richtig oder falsch?',ms:'Mehrere Antworten möglich',ma:'Ordne einander zu',or:'Bringe in die richtige Reihenfolge',nu:'Rechenaufgabe'}[q.t];}

  ready:()=>sel!==null,

function vMS(q){const opts=shuffle(q.ok.map(t=>({t,ok:true})).concat(q.bad.map(t=>({t,ok:false}))));const sel=new Set();
  return{html:opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">☐</span>${esc(o.t)}</button>`).join(''),
  bind(root,chg){root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(R.locked)return;const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel',sel.has(i));b.querySelector('.k').textContent=sel.has(i)?'☑':'☐';chg();});},

function vMA(q){const L=shuffle(q.p.map((p,i)=>({t:p[0],i}))),Rr=shuffle(q.p.map((p,i)=>({t:p[1],i})));const map={};let selL=null,n=0;const col={};

    else{const li=Object.keys(map).find(k=>map[k]===i);if(li!==undefined)delete map[li];else if(selL!==null){map[selL]=i;col[selL]=(n++)%6;selL=null;}}

  ready:()=>Object.keys(map).length===q.p.length,

function vOR(q){const items=q.items.map((t,i)=>({t,i}));const pool=shuffle(items);let placed=[];

function parseNum(s){s=String(s).replace(/[€%\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s);}

function checkQ(q){
  if(R.locked||!R.cur.ready())return;R.locked=true;
  const body=$('#qbody'),g=R.cur.grade(body);
  S.stats.answers++;if(g.ok)S.stats.correct++;
  const first=!R.retried.has(q);
  R.log.push({q,ok:g.ok,ans:g.raw?g.ans:esc(g.ans),first});
  let xp=0;
  if(g.ok){R.correct++;if(first){R.first++;xp=10+(R.combo>=3?2:0)+(R.combo>=5?3:0);}else xp=4;R.combo++;R.xp+=xp;
    if(S.mist[q.id]){delete S.mist[q.id];S.stats.fixed++;}
    if(R.kind==='calc')S.stats.calcRight++;
    sfx('ok');}
  else{R.wrong++;R.combo=0;if(R.hearts!=null)R.hearts--;
    S.mist[q.id]=QMAP[q.id]?1:q;
    if(!R.noRetry&&first){R.retried.add(q);R.queue.push(q);}
    sfx('bad');}
  save();
  const dead=R.hearts!=null&&R.hearts<=0;
  if(R.noFeedback){R.i++;R.locked=false;showQ();return;}
  const foot=$('#foot'),ans=g.raw?g.ans:esc(g.ans);
  foot.className='run-foot '+(g.ok?'ok':'bad');
  const mood=g.ok?`${pick(PRAISE)}${xp?' <span style="font-size:.85rem;opacity:.85">+'+xp+' XP'+(R.combo>=4?' · 🔥 Combo '+R.combo:'')+'</span>':''}`:'Leider daneben';
  foot.innerHTML=`<div class="in"><div class="fb-t">${g.ok?'✅':'❌'} ${mood}</div><div class="fb-e">${g.ok?'':'<b>Richtig:</b> '+ans+'<br>'}${q.e?(q.html?q.e:esc(q.e)):''}</div><button class="btn ${g.ok?'green':'red'} full" id="nxt">${dead?'Weiter':'Weiter'}</button></div>`;
  const hd=$('.run-top .hearts');if(hd)hd.innerHTML=''+'❤️'.repeat(Math.max(0,R.hearts))+'🖤'.repeat(Math.max(0,3-R.hearts));
  $('#nxt').onclick=()=>{R.i++;if(dead){finishRun(true);}else showQ();};
  setTimeout(()=>{const f=$('.fb-e');if(f)f.scrollTop=0;},0);
}
function exitRun(){if(confirm('Lektion abbrechen? Fortschritt dieser Runde geht verloren.')){closeOv();}}
function finishRun(dead){
  if(!R)return;if(R.timer)clearInterval(R.timer);
  const o=R,secs=Math.round((Date.now()-o.t0)/1000),acc=o.log.length?Math.round(o.log.filter(l=>l.ok&&l.first).length/o.total*100):0;
  const failed=!!dead||(o.hearts!=null&&o.hearts<=0);
  let bonus=0,stars=0,title='',emoji='🎉';
  if(!failed){
    if(o.kind==='lesson'){stars=Math.max(1,o.hearts);const k=o.key;S.prog[k]=Math.max(S.prog[k]||0,stars);S.stats.lessons++;if(o.wrong===0){S.stats.perfect++;bonus+=15;}bonus+=20;title='Lektion geschafft!';}
    else if(o.kind==='boss'){const u=UNITS[o.ui];S.boss[u.id]=Math.max(S.boss[u.id]||0,acc);bonus=30;stars=Math.max(1,o.hearts);title='Endgegner besiegt!';emoji='👑';}
    else if(o.kind==='sim'){const p=Math.round(o.correct/o.total*100);S.stats.simBest=Math.max(S.stats.simBest,p);bonus=Math.round(p/2);title=p>=85?'Sehr gut – Klausur gerockt!':p>=70?'Gut – klausurreif!':p>=50?'Bestanden – noch etwas Feinschliff':'Noch nicht bestanden – weiter üben!';emoji=p>=70?'🏆':p>=50?'👍':'📚';}
    else{bonus=10;title='Runde geschafft!';}
  }else{title='Keine Herzen mehr';emoji='💔';}
  const xpGain=Math.round((o.xp+bonus)*(failed?0.3:(o.xpMul||1)));
  if(xpGain>0)addXp(xpGain);
  save();
  if(!failed&&o.kind!=='sim')confetti();
  if(!failed)sfx('win');else sfx('bad');
  const pct=Math.round(o.correct/Math.max(1,o.log.length)*100);
  let review='';
  if(o.kind==='sim'){const wr=o.log.filter(l=>!l.ok);review=wr.length?`<div style="text-align:left;margin-top:10px"><h3>Zum Nacharbeiten (${wr.length})</h3>${wr.map(l=>`<div class="card"><b>${l.q.html?l.q.q:esc(l.q.q)}</b><div class="muted mt">Richtig: ${l.ans}</div><div style="font-size:.88rem;margin-top:4px">${l.q.e?(l.q.html?l.q.e:esc(l.q.e)):''}</div></div>`).join('')}</div>`:'<p>Fehlerfrei! 🎯</p>';}
  const cb=o.onDone;
  openOv(`<div class="run-body"><div class="res"><div class="big">${emoji}</div><h2>${title}</h2>${stars?`<div class="stars">${'⭐'.repeat(stars)}${'<span style="opacity:.25">⭐</span>'.repeat(3-stars)}</div>`:''}<div class="stats"><div class="stat"><small>XP</small><b style="color:var(--gold)">+${xpGain}</b></div><div class="stat"><small>Richtig</small><b>${o.kind==='sim'?Math.round(o.correct/o.total*100):acc}%</b></div><div class="stat"><small>Zeit</small><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b></div></div>${review}</div></div><div class="run-foot"><div class="in row"><button class="btn green" style="flex:1" id="rdone">Weiter</button>${failed&&o.kind==='lesson'?'<button class="btn gold" id="rretry">Nochmal</button>':''}</div></div>`);
  $('#rdone').onclick=()=>closeOv();
  const rr=$('#rretry');if(rr)rr.onclick=()=>{const ui=o.ui,li=o.li;R=null;ov().classList.add('hidden');startLesson(ui,li);};
}

  return NUh(`Anleihe: Nominal ${f0(N)} €, Kupon ${nf(c,1)} %, Restlaufzeit ${n} Jahre, Rendite ${nf(y,1)} %. Marktwert?`,mw,1,'€',sol(st,`Marktwert = ${f2(mw)} €`));}},
zero:{ic:'0️⃣',t:'Zerobond',d:'Preis & Zins',make(){const n=ri(2,10),z=pick([1,1.5,2,2.5,3,4,5,6]);if(Math.random()<.5){const p=100/Math.pow(1+z/100,n);return NUh(`Zerobond (Nominal 100), Laufzeit ${n} Jahre, Nullkuponzins ${nf(z,1)} %. Fairer Preis?`,p,.02,'',sol([`P = 100 ÷ (1+${nf(z/100,3)})<sup>${n}</sup>`],`${f2(p)}`));}
  const p=Math.round(100/Math.pow(1+z/100,n)*100)/100,r=(Math.pow(100/p,1/n)-1)*100;return NUh(`Ein Zerobond (Nominal 100, Laufzeit ${n} Jahre) kostet ${f2(p)}. Wie hoch ist die Rendite p. a.?`,r,.02,'%',sol([`R = (100 ÷ ${f2(p)})<sup>1/${n}</sup> − 1`],pct(r)));}},
ytm1:{ic:'📐',t:'Rendite berechnen',d:'1-jährige & 2-jährige Anleihe',make(){const N=1000000,c=pick([2,3,4,5]),y=pick([1,2,3,4,5,6]);if(Math.random()<.5){const mw=Math.round(N*(1+c/100)/(1+y/100)*100)/100,r=(N*(1+c/100)/mw-1)*100;return NUh(`1-jährige Anleihe, Nominal ${f0(N)} €, Kupon ${c} %, Marktwert ${f2(mw)} €. Rendite?`,r,.02,'%',sol([`Rückfluss in t=1: ${f2(N*(1+c/100))} €`,`R = ${f2(N*(1+c/100))} ÷ ${f2(mw)} − 1`],pct(r)));}
  const n=2,cf=[N*c/100,N*(1+c/100)],mw=Math.round(pvSum(cf,y/100)*100)/100,r=ytmSolve(cf,mw)*100;return NUh(`2-jährige Anleihe, Nominal ${f0(N)} €, Kupon ${c} %, Marktwert ${f2(mw)} €. Rendite (Näherung genügt)?`,r,.03,'%',sol([`Gesucht: R mit ${f2(cf[0])}/(1+R) + ${f2(cf[1])}/(1+R)² = ${f2(mw)}`,'Iterativ / quadratische Gleichung lösen'],pct(r)));}},
zrate:{ic:'📉',t:'Nullkuponzins ermitteln',d:'Bootstrapping 2. Jahr',make(){const N=1000000,c=pick([2,3,4]),z1=pick([1,1.5,2,2.5]),z2=z1+pick([.5,.8,1,1.2]);const mw=Math.round((N*c/100/(1+z1/100)+N*(1+c/100)/Math.pow(1+z2/100,2))*100)/100;const rest=mw-N*c/100/(1+z1/100),z=(Math.sqrt(N*(1+c/100)/rest)-1)*100;
  return NUh(`Nullkuponzins für 1 Jahr: ${nf(z1,1)} %. Eine 2-jährige Anleihe (Nominal ${f0(N)} €, Kupon ${c} %) hat den Marktwert ${f2(mw)} €. Wie hoch ist der Nullkuponzins für 2 Jahre?`,z,.02,'%',sol([`Barwert Zahlung t=1: ${f2(N*c/100)} ÷ ${nf(1+z1/100,4)} = ${f2(N*c/100/(1+z1/100))}`,`Rest für t=2: ${f2(rest)}`,`z₂ = (${f2(N*(1+c/100))} ÷ ${f2(rest)})<sup>1/2</sup> − 1`],pct(z)));}},
dur:{ic:'⏱️',t:'Duration',d:'Macaulay-Duration',make(){const c=pick([3,4,5,6]),n=pick([2,3,4]),y=pick([2,3,4,5,6]);const cf=[];for(let t=1;t<=n;t++)cf.push(c+(t===n?100:0));const r=durOf(cf,y/100);const st=cf.map((x,i)=>`t=${i+1}: PV = ${f2(x/Math.pow(1+y/100,i+1))} · ${i+1} = ${f2((i+1)*x/Math.pow(1+y/100,i+1))}`);
  return NUh(`Anleihe: Nominal 100, Kupon ${c} %, Laufzeit ${n} Jahre, Rendite ${y} %. Macaulay-Duration in Jahren?`,r.d,.02,'Jahre',sol(st.concat([`MW = ${f2(r.mw)}`,`D = Σ(t·PV) ÷ MW`]),`${f2(r.d)} Jahre`));}},
moddur:{ic:'📏',t:'Modified Duration',d:'Zinssensitivität',make(){const D=pick([2.5,3.4,4.77,6.2,8.0]),y=pick([2,3,4,5]);const md=D/(1+y/100);if(Math.random()<.5)return NUh(`Macaulay-Duration ${nf(D,2)} Jahre, Marktrendite ${y} %. Modified Duration?`,md,.02,'',sol([`MD = ${nf(D,2)} ÷ ${nf(1+y/100,2)}`],f2(md)));
  const dr=pick([.5,1,2]);return NUh(`Modified Duration ${f2(md)}. Die Marktrendite steigt um ${nf(dr,1)} Prozentpunkte. Um wie viel Prozent fällt der Marktwert ungefähr?`,md*dr,.05,'%',sol([`ΔMW/MW ≈ −MD · ΔR = −${f2(md)} · ${nf(dr,1)} %`],`−${f2(md*dr)} % (Rückgang)`));}},
os:{ic:'🎟️',t:'Optionsschein-Kennzahlen',d:'Hebel, Aufgeld, Break-even',make(){const S0=pick([60,80,100,120,150,180]),bp=S0-pick([5,10,15,20,30]),op=(S0-bp)+pick([3,5,8,10,12]);const inner=S0-bp,hebel=S0/op,aufg=(op+bp-S0)/S0*100,be=bp+op;const all=sol([`Innerer Wert = ${S0} − ${bp} = ${inner}`,`Hebel = ${S0} ÷ ${op} = ${f2(hebel)}`,`Aufgeld = (${op} + ${bp} − ${S0}) ÷ ${S0} = ${f2(aufg)} %`,`Break-even = ${bp} + ${op} = ${be}`],'siehe oben');
  const k=pick(['inner','hebel','aufg','be']);const base=`Call-Optionsschein (Bezugsverhältnis 1:1): Aktienkurs ${S0} €, Basispreis ${bp} €, Optionsscheinpreis ${op} €.`;
  if(k==='inner')return NUh(base+' Innerer Wert?',inner,0,'€',all);if(k==='hebel')return NUh(base+' Hebel?',hebel,.02,'',all);if(k==='aufg')return NUh(base+' Aufgeld in %?',aufg,.05,'%',all);return NUh(base+' Break-even-Kurs der Aktie?',be,0,'€',all);}},
bonus:{ic:'🎁',t:'Bonuszertifikat',d:'Barriere, Bonus, Rückzahlung',make(){const S0=pick([40,50,80,100]),bar=S0*pick([.6,.65,.7,.75]),bon=S0*pick([1.1,1.15,1.2,1.25]),T=pick([1,2,3]);const k=pick(['abst','rend','pay1','pay2']);
  const base=`Bonuszertifikat auf eine Aktie (Kurs bei Emission ${f0(S0)} €, Preis des Zertifikats ${f0(S0)} €): Barriere ${f0(bar)} €, Bonusbetrag ${f0(bon)} €, Laufzeit ${T} Jahr(e).`;
  if(k==='abst'){const a=(S0-bar)/S0*100;return NUh(base+' Abstand zur Barriere in %?',a,.05,'%',sol([`(${f0(S0)} − ${f0(bar)}) ÷ ${f0(S0)}`],pct(a)));}
  if(k==='rend'){const r=(bon-S0)/S0*100/T;return NUh(base+' Seitwärtsrendite p. a. in %?',r,.05,'%',sol([`(${f0(bon)} − ${f0(S0)}) ÷ ${f0(S0)} ÷ ${T} Jahre`],pct(r)));}
  const fin=Math.round(S0*pick([.9,1,1.05])*100)/100;if(k==='pay1')return NUh(base+` Die Barriere wurde NIE berührt, der Aktienkurs steht am Ende bei ${f2(fin)} €. Rückzahlung?`,Math.max(bon,fin),.01,'€',sol([`max(Bonus ${f0(bon)}; Kurs ${f2(fin)})`],f2(Math.max(bon,fin))+' €'));
  return NUh(base+` Die Barriere wurde während der Laufzeit BERÜHRT, der Aktienkurs steht am Ende bei ${f2(fin)} €. Rückzahlung?`,fin,.01,'€',sol(['Barriere verletzt → Zertifikat folgt dem Basiswert 1:1'],f2(fin)+' €'));}},
disc:{ic:'🏷️',t:'Discountzertifikat',d:'Discount, Max-Rendite, Rückzahlung',make(){const S0=pick([40,50,80,100]),d=pick([6,8,10,12,15]),P=Math.round(S0*(1-d/100)*100)/100,cap=S0;const k=pick(['d','r','p']);const base=`Discountzertifikat: Aktienkurs ${f0(S0)} €, Preis des Zertifikats ${f2(P)} €, Cap ${f0(cap)} €, Laufzeit genau 1 Jahr.`;
  if(k==='d'){const x=(S0-P)/S0*100;return NUh(base+' Discount in %?',x,.05,'%',sol([`(${f0(S0)} − ${f2(P)}) ÷ ${f0(S0)}`],pct(x)));}
  if(k==='r'){const x=(cap-P)/P*100;return NUh(base+' Maximale Rendite in %?',x,.05,'%',sol([`(${f0(cap)} − ${f2(P)}) ÷ ${f2(P)}`],pct(x)));}
  const fin=Math.round(S0*pick([.8,.9,1.1,1.2])*100)/100,pay=Math.min(fin,cap);return NUh(base+` Der Aktienkurs am Bewertungstag: ${f2(fin)} €. Rückzahlung?`,pay,.01,'€',sol([`min(Kurs ${f2(fin)}; Cap ${f0(cap)})`],f2(pay)+' €'));}},
sprint:{ic:'🏃',t:'Sprint & Outperformance',d:'Partizipation & Cap',make(){const bp=pick([40,50,80,100]),cap=bp*pick([1.1,1.2]),pf=pick([1.5,2]);if(Math.random()<.5){const maxb=bp+(cap-bp)*pf;return NUh(`Sprint-Zertifikat: Basispreis ${f0(bp)} €, Cap ${f0(cap)} €, Partizipationsfaktor ${nf(pf,1)}. Höchstbetrag?`,maxb,.01,'€',sol([`${f0(bp)} + (${f0(cap)} − ${f0(bp)}) × ${nf(pf,1)}`],f2(maxb)+' €'));}
  const fin=bp*pick([.9,1.05,1.1,1.2]),pay=fin<=bp?fin:bp+pf*(fin-bp);return NUh(`Outperformance-Zertifikat: Basispreis ${f0(bp)} €, Partizipationsfaktor ${nf(pf,1)}, kein Cap. Basiswert am Laufzeitende: ${f2(fin)} €. Rückzahlung?`,pay,.01,'€',sol([fin<=bp?'Unter/auf Basispreis: Rückzahlung 1:1':`${f0(bp)} + ${nf(pf,1)} × (${f2(fin)} − ${f0(bp)})`],f2(pay)+' €'));}},
express:{ic:'🚄',t:'Expresszertifikat',d:'Auszahlungsbeträge',make(){const ez=pick([6,7.5,8,9]),S0=pick([40,50,100]),bar=.6,k=pick(['k','fin']);const NW=1000;
  if(k==='k'){const t=ri(1,3);return NUh(`Expresszertifikat: Nennwert ${f0(NW)} €, Express-Zahlung ${nf(ez,1)} % p. a. (nicht kumuliert gezahlt, sondern aufgeschoben). Das Auszahlungslevel wird erstmals am ${t}. Bewertungstag erreicht. Auszahlung?`,NW*(1+ez*t/100),.01,'€',sol([`${f0(NW)} + ${t} × ${f2(NW*ez/100)}`],f2(NW*(1+ez*t/100))+' €'));}
  const fin=Math.round(S0*pick([.4,.45,.5,.55])*100)/100;return NUh(`Expresszertifikat auf eine Aktie (Start ${f0(S0)} €, Nennwert ${f0(NW)} €), Barriere ${f0(S0*bar)} € (60 %), nie vorzeitig fällig geworden. Am finalen Bewertungstag steht die Aktie bei ${f2(fin)} €, das Auszahlungslevel (${f0(S0)} €) ist verfehlt. Rückzahlung?`,fin<=S0*bar?NW*fin/S0:NW,.01,'€',sol([fin<=S0*bar?`Barriere verletzt: ${f0(NW)} × ${f2(fin)} ÷ ${f0(S0)}`:'Über der Barriere, unter dem Level: Nennwert'],f2(fin<=S0*bar?NW*fin/S0:NW)+' €'));}},
aktA:{ic:'📄',t:'Aktienanleihe',d:'Kupon + Rückzahlung',make(){const c=pick([5,6,7,8]),bp=pick([40,50,80,100]),fin=Math.round(bp*pick([.7,.85,1.1,1.2])*100)/100,N=1000;const back=fin>=bp?N:N/bp*fin,tot=back+N*c/100;return NUh(`Aktienanleihe: Nominal ${f0(N)} €, Kupon ${c} %, Basispreis ${f0(bp)} € (Bezugsverhältnis ${f2(N/bp)} Aktien). Aktienkurs bei Fälligkeit: ${f2(fin)} €. Gesamtrückfluss (Wert der Rückzahlung inkl. Kupon)?`,tot,.5,'€',sol([fin>=bp?`Kurs ≥ Basispreis: Rückzahlung ${f0(N)} €`:`Aktienlieferung: ${f2(N/bp)} Aktien × ${f2(fin)} € = ${f2(back)} €`,`+ Kupon ${f2(N*c/100)} €`],f2(tot)+' €'));}},
kgv:{ic:'📈',t:'Aktienkennzahlen',d:'KGV, Dividendenrendite, DVFA',make(){const k=pick(['kgv','dr','kurs','dvfa']);if(k==='kgv'){const g=pick([2,3,4,5,6]),kg=pick([10,12,15,18,20]);return NUh(`Aktienkurs ${f0(g*kg)} €, Gewinn je Aktie ${g} €. KGV?`,kg,.01,'',sol([`${f0(g*kg)} ÷ ${g}`],f0(kg)));}
  if(k==='dr'){const kurs=pick([40,50,60,80]),dv=pick([1,1.5,2,2.4]);return NUh(`Dividende ${nf(dv,2)} €, Aktienkurs ${f0(kurs)} €. Dividendenrendite?`,dv/kurs*100,.02,'%',sol([`${nf(dv,2)} ÷ ${f0(kurs)}`],pct(dv/kurs*100)));}
  if(k==='kurs'){const g=pick([2,3,5]),kg=pick([12,15,16]);return NUh(`Vergleichbare Unternehmen haben ein KGV von ${kg}. Der Gewinn je Aktie beträgt ${g} €. Fairer Kurs?`,g*kg,.01,'€',sol([`${g} × ${kg}`],f0(g*kg)+' €'));}
  const e=pick([20,40,60]),kg=pick([10,15]),a=pick([10,20]);return NUh(`Festpreisverfahren: DVFA-Ergebnis ${e} Mio €, vergleichbares KGV ${kg}, ${a} Mio Aktien. Wert je Aktie?`,e*kg/a,.01,'€',sol([`${e} × ${kg} = ${e*kg} Mio € Unternehmenswert`,`÷ ${a} Mio Aktien`],f2(e*kg/a)+' €'));}},
bezug:{ic:'🧾',t:'Bezugsrecht',d:'Rechnerischer Wert',make(){const ka=pick([60,80,100,120]),kn=ka-pick([10,20,30]),v=pick([3,4,5]);const br=(ka-kn)/(v+1);return NUh(`Kapitalerhöhung gegen Einlagen im Verhältnis ${v}:1. Kurs der alten Aktie ${f0(ka)} €, Bezugskurs der jungen Aktie ${f0(kn)} €. Rechnerischer Wert des Bezugsrechts?`,br,.01,'€',sol([`BR = (K<sub>alt</sub> − K<sub>neu</sub>) ÷ (Bezugsverhältnis + 1)`,`= (${f0(ka)} − ${f0(kn)}) ÷ (${v} + 1)`],f2(br)+' €'));}},
wsv:{ic:'🔁',t:'Wandelanleihe',d:'Bedingte Kapitalerhöhung',make(){const V=pick([100,200,300,500]),q=pick([2,3,4]);const st=V/q;return NUh(`${f0(V)} Mio € Wandelschuldverschreibungen (Stückelung 100 €). Umtauschverhältnis ${q}:1 (${q} WSV à 100 € → 1 Aktie à 100 € Nennwert). Maximale bedingte Kapitalerhöhung in Mio €?`,st,.01,'Mio €',sol([`${f0(V)} Mio € ÷ ${q} = ${f0(st)} Mio € Aktien-Nennbetrag`],f2(st)+' Mio €'));}},
swap:{ic:'🔄',t:'Zinsswap',d:'Nettozahlung & Forward Rate',make(){if(Math.random()<.6){const N=pick([5,10,20]),fx=pick([2.5,3,3.5]),vr=fx-pick([.4,.6,.8,1]);const net=N*1e6*(fx-vr)/100;return NUh(`Payer-Swap: Nominal ${N} Mio €, Festsatz ${nf(fx,1)} %, variabler Satz ${nf(vr,1)} %. Nettozahlung des Payers pro Jahr (Betrag in €)?`,net,1,'€',sol([`(${nf(fx,1)} % − ${nf(vr,1)} %) × ${N} Mio €`],f0(net)+' € (Payer zahlt netto)'));}
  const z1=pick([1,1.5,2]),z2=z1+pick([.5,1,1.5]),f=(Math.pow(1+z2/100,2)/(1+z1/100)-1)*100;return NUh(`Nullkuponzinssätze: z₁ = ${nf(z1,1)} %, z₂ = ${nf(z2,1)} %. Forward Rate für Jahr 2?`,f,.02,'%',sol([`f = (1+z₂)² ÷ (1+z₁) − 1`,`= ${nf(1+z2/100,4)}² ÷ ${nf(1+z1/100,4)} − 1`],pct(f)));}},
spread:{ic:'↔️',t:'Geld-Brief-Spanne',d:'Spread in € und %',make(){const br=pick([50,100,25.5,12.4]),sp=pick([.2,.3,.5,.8,1]);const g=Math.round((br-sp)*100)/100;if(Math.random()<.5)return NUh(`Geldkurs ${f2(g)} €, Briefkurs ${f2(br)} €. Geld-Brief-Spanne in €?`,br-g,.005,'€',sol([`${f2(br)} − ${f2(g)}`],f2(br-g)+' €'));
  return NUh(`Geldkurs ${f2(g)} €, Briefkurs ${f2(br)} €. Spanne in % vom Briefkurs?`,(br-g)/br*100,.02,'%',sol([`(${f2(br)} − ${f2(g)}) ÷ ${f2(br)}`],pct((br-g)/br*100)));}}
};
function fallstudie(){
  const N=1e6,y5=ytmSolve([25000,25000,25000,25000,1025000],1038038.24),z1=1017000/1003948.67-1,z2=Math.sqrt(1019000/(1009793.85-19000/(1+z1)))-1,z3=Math.cbrt(1021000/(1018947.88-21000/(1+z1)-21000/Math.pow(1+z2,2)))-1;
  const mwWP=pvSum([15000,15000,1015000],.0145),mwZ=15000/(1+z1)+15000/Math.pow(1+z2,2)+1015000/Math.pow(1+z3,3);
  const zb=N/Math.pow(1+z3,3);const dA=durOf([25000,25000,25000,25000,1025000],.017),mdA=dA.d/1.017,mdZ=5/1.017119;
  const H=(t,x)=>`<b>${t}</b><br>${x}`;
  return[
  NUh('<b>Fallstudie a)</b> Anleihe: Nominal 1 Mio €, Kupon 2,5 %, Restlaufzeit 5 Jahre, Marktwert 1.038.038,24 €. Anleihespezifische Rendite?',y5*100,.01,'%',sol(['MW = Σ CF/(1+R)<sup>t</sup> mit CF = 25.000 (t=1–4) und 1.025.000 (t=5)','Iterative Lösung (Zielwertsuche / interner Zinsfuß)'],pct(y5*100))),
  NUh('<b>Fallstudie b)</b> 1-jährige Anleihe: Kupon 1,7 %, Nominal 1 Mio €, Marktwert 1.003.948,67 €. Nullkuponzins für 1 Jahr?',z1*100,.01,'%',sol(['z₁ = 1.017.000 ÷ 1.003.948,67 − 1'],pct(z1*100))),
  NUh('<b>Fallstudie b)</b> 2-jährige Anleihe: Kupon 1,9 %, Marktwert 1.009.793,85 €. Nullkuponzins für 2 Jahre (z₁ aus der vorigen Aufgabe)?',z2*100,.01,'%',sol(['1.009.793,85 = 19.000/(1+z₁) + 1.019.000/(1+z₂)²',`Rest nach t=1: ${f2(1009793.85-19000/(1+z1))}`,'z₂ = √(1.019.000 ÷ Rest) − 1'],pct(z2*100))),
  NUh('<b>Fallstudie b)</b> 3-jährige Anleihe: Kupon 2,1 %, Marktwert 1.018.947,88 €. Nullkuponzins für 3 Jahre (mit z₁ = 1,30 % und z₂ = 1,4009 %)?',z3*100,.01,'%',sol(['1.018.947,88 = 21.000/(1+z₁) + 21.000/(1+z₂)² + 1.021.000/(1+z₃)³','z₃ = ³√(1.021.000 ÷ Rest) − 1'],pct(z3*100))),
  NUh('<b>Fallstudie c)</b> Anleihe 1 Mio €, 3 Jahre, Kupon 1,5 %. Marktwert mit der <b>Wertpapierrendite aus b)</b> (1,45 %)?',mwWP,1,'€',sol(['15.000/1,0145 + 15.000/1,0145² + 1.015.000/1,0145³'],f2(mwWP)+' €')),
  NUh('<b>Fallstudie c)</b> Gleiche Anleihe. Marktwert mit den <b>Nullkuponzinssätzen</b> (1,30 % / 1,4009 % / 1,4517 %)? Gleichzeitig der Wert nach den anleihespezifischen Renditen (Replikation).',mwZ,1,'€',sol(['15.000/(1+z₁) + 15.000/(1+z₂)² + 1.015.000/(1+z₃)³','Mit Hilfe der anleihespezifischen Renditen (Kreditaufnahme 3 J., Kapitalanlagen 2 J. und 1 J.) ergibt sich derselbe Wert.'],f2(mwZ)+' €')),
  NUh('<b>Fallstudie d)</b> Fairer Emissionspreis eines echten Zerobonds: Nominal 1 Mio €, Laufzeit 3 Jahre (z₃ = 1,4517 %)?',zb,2,'€',sol(['P = 1.000.000 ÷ (1+z₃)³'],f2(zb)+' €')),
  NUh('<b>Fallstudie e)</b> Macaulay-Duration der Anleihe aus a) (Rendite 1,7 %)?',dA.d,.01,'Jahre',sol(['D = Σ t·PV(CF<sub>t</sub>) ÷ MW'],f2(dA.d)+' Jahre')),
  NUh('<b>Fallstudie e)</b> Modified Duration der Anleihe aus a)?',mdA,.01,'',sol(['MD = D ÷ (1 + 0,017)'],f2(mdA))),
  NUh('<b>Fallstudie e)</b> Modified Duration des 5-jährigen Zerobonds (Nullkuponzins 1,7119 %)?',mdZ,.01,'',sol(['D = 5 Jahre (Zerobond), MD = 5 ÷ 1,017119'],f2(mdZ)+' – höher als bei der Kuponanleihe, weil keine laufenden Zahlungen den Schwerpunkt nach vorne ziehen.'))
  ];}
function vCalc(m){
  m.innerHTML=`<h2 class="sec" style="margin-top:0">🧮 Rechen-Lab</h2><p class="muted">Jede Runde: 5 Aufgaben mit zufälligen Zahlen und ausführlichem Lösungsweg. Dezimalkomma verwenden (z. B. 4,75).</p><div class="card" style="border-color:var(--gold)"><h3>📋 Original-Fallstudie „Bewertung von Anleihen“</h3><p class="muted">Alle Teilaufgaben a)–e) der Vorlesung als Schritt-für-Schritt-Training.</p><button class="btn gold full" onclick="startFall()">Fallstudie starten</button></div><div class="grid">${Object.keys(GEN).map(k=>`<div class="tile" onclick="startCalc('${k}')"><div class="ic">${GEN[k].ic}</div><h4>${GEN[k].t}</h4><p>${GEN[k].d}</p></div>`).join('')}<div class="tile" onclick="startCalc('mix')" style="border-color:var(--purple)"><div class="ic">🎲</div><h4>Gemischte Runde</h4><p>Zufällige Aufgaben aus allen Bereichen</p></div></div>`;}
function startCalc(k){const keys=Object.keys(GEN),qs=[];for(let i=0;i<5;i++)qs.push(GEN[k==='mix'?pick(keys):k].make());runQs({title:'Rechen-Lab',qs,hearts:null,color:'#ffc800',kind:'calc',noRetry:true});}
function startFall(){runQs({title:'Fallstudie',qs:fallstudie(),hearts:null,color:'#ffc800',kind:'calc',noRetry:true});}

let ST={pid:'index',p:{},S:100,min:100};
function stSetProd(id){ST.pid=id;const pr=PRODS.find(x=>x.id===id);ST.p={};pr.params.forEach(q=>ST.p[q.k]=q.v);ST.S=100;ST.min=100;vStudio($('#main'));}
function stRet(pr,S,touched){const pay=pr.pay(S,ST.p,touched),pc=pr.price(ST.p);return pay==null?null:(pay-pc)/pc*100;}
function stDraw(){
  const pr=PRODS.find(x=>x.id===ST.pid),p=ST.p;const W=640,H=330,pl=48,pr_=14,pt=14,pb=36,X0=0,X1=160;
  const bar=pr.barrier?pr.barrier(p):null,minEff=Math.min(ST.min,ST.S,100),touched=!!(pr.useMin&&bar!=null&&minEff<=bar);
  const main=[],alt=[],dir=[];let ymax=40;
  for(let x=X0;x<=X1;x+=1){const t=bar!=null&&x<=bar;const a=stRet(pr,x,t);main.push([x,a]);if(a!=null&&a>ymax)ymax=a;if(bar!=null){const b=stRet(pr,x,true);alt.push([x,b]);}dir.push([x,x-100]);}
  ymax=Math.min(ymax,300);ymax=Math.max(50,Math.ceil(ymax/(ymax>150?100:50))*(ymax>150?100:50));if(ymax<=250&&ymax>150)ymax=Math.ceil(ymax/50)*50;
  const ymin=-100,px=x=>pl+(x-X0)/(X1-X0)*(W-pl-pr_),py=y=>pt+(ymax-Math.max(ymin-4,Math.min(ymax+4,y)))/(ymax-ymin)*(H-pt-pb);
  const path=a=>{let d='',pen=false;a.forEach(([x,y])=>{if(y==null){pen=false;return;}d+=(pen?'L':'M')+px(x).toFixed(1)+' '+py(y).toFixed(1)+' ';pen=true;});return d;};
  const step=ymax>250?100:ymax>100?50:25;let g='';
  for(let y=ymin;y<=ymax;y+=step){g+=`<line x1="${pl}" x2="${W-pr_}" y1="${py(y)}" y2="${py(y)}" stroke="${y===0?'#6b8594':'#243640'}" stroke-width="${y===0?1.6:1}"/><text x="${pl-6}" y="${py(y)+4}" fill="#9fb3bf" font-size="11" text-anchor="end">${y>0?'+':''}${y}%</text>`;}
  for(let x=0;x<=160;x+=20)g+=`<line x1="${px(x)}" x2="${px(x)}" y1="${pt}" y2="${H-pb}" stroke="${x===100?'#4b6a7a':'#1c2b33'}" stroke-dasharray="${x===100?'4 3':'0'}"/><text x="${px(x)}" y="${H-pb+16}" fill="#9fb3bf" font-size="11" text-anchor="middle">${x}</text>`;
  g+=`<text x="${(pl+W-pr_)/2}" y="${H-4}" fill="#9fb3bf" font-size="11" text-anchor="middle">Kurs des Basiswerts bei Fälligkeit (Start = 100)</text>`;
  if(bar!=null)g+=`<line x1="${px(bar)}" x2="${px(bar)}" y1="${pt}" y2="${H-pb}" stroke="#ff4b4b" stroke-dasharray="5 4"/><text x="${px(bar)+4}" y="${pt+11}" fill="#ff7b7b" font-size="11">Barriere ${f0(bar)}</text>`;
  const clip=`<clipPath id="cp"><rect x="${pl}" y="${pt}" width="${W-pl-pr_}" height="${H-pt-pb}"/></clipPath>`;
  const sy=stRet(pr,ST.S,touched);
  let mk='';if(sy!=null)mk=`<line x1="${px(ST.S)}" x2="${px(ST.S)}" y1="${py(sy)}" y2="${H-pb}" stroke="#fff" stroke-dasharray="3 3" opacity=".5"/><circle cx="${px(ST.S)}" cy="${py(sy)}" r="6" fill="${sy>=0?'#58cc02':'#ff4b4b'}" stroke="#fff" stroke-width="2"/>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}">${clip}${g}<g clip-path="url(#cp)"><path d="${path(dir)}" fill="none" stroke="#9fb3bf" stroke-width="2" stroke-dasharray="6 5"/>${bar!=null?`<path d="${path(alt)}" fill="none" stroke="${pr.col}" stroke-width="2" opacity=".35" stroke-dasharray="2 4"/>`:''}<path d="${path(main)}" fill="none" stroke="${pr.col}" stroke-width="4" stroke-linejoin="round"/></g>${mk}<text x="${pl+8}" y="${pt+26}" fill="${pr.col}" font-size="12" font-weight="700">━ ${pr.n}</text><text x="${pl+8}" y="${pt+42}" fill="#9fb3bf" font-size="12">╍ Direktinvestment</text>${bar!=null?`<text x="${pl+8}" y="${pt+58}" fill="${pr.col}" opacity=".6" font-size="12">∙∙ falls Barriere berührt</text>`:''}</svg>`;
  const pay=pr.pay(ST.S,p,touched),pc=pr.price(p);let ro='';
  if(pay==null)ro=`<div class="r1">Bewertungstag ${Math.round(p.k)}: Basiswert (${f0(ST.S)}) unter Level → <span class="muted">Zertifikat läuft weiter, keine Auszahlung</span></div>`;
  else{const gain=pay-pc,pctv=gain/pc*100;ro=`<div class="r1">Rückzahlung: ${f2(pay)} € <span class="${gain>=0?'pos':'neg'}">(${gain>=0?'+':''}${f1(pctv)} %)</span></div><div class="muted">Kaufpreis ${f2(pc)} € · Direktinvestment: <b class="${ST.S>=100?'pos':'neg'}">${ST.S>=100?'+':''}${f0(ST.S-100)} %</b>${touched?' · <span class="neg">Barriere / KO verletzt!</span>':''}</div>`;}
  $('#stchart').innerHTML=svg;$('#strd').innerHTML=ro+(pr.facts?`<div class="tip">${pr.facts(p)}</div>`:'');
  if(sy!=null&&ST.S!==100&&!window._stX){}
}
function vStudio(m){
  const pr=PRODS.find(x=>x.id===ST.pid);if(!Object.keys(ST.p).length&&pr.params.length)pr.params.forEach(q=>ST.p[q.k]=q.v);
  m.innerHTML=`<div class="studio"><h2 class="sec" style="margin-top:0">📊 Payoff-Studio</h2><p class="muted">Verstehe jedes Produkt am Auszahlungsprofil: Ziehe die Regler und beobachte Gewinn/Verlust (in % des Kaufpreises) im Vergleich zum Direktinvestment.</p><div class="prodpick">${PRODS.map(x=>`<button class="${x.id===ST.pid?'on':''}" onclick="stSetProd('${x.id}')">${x.ic} ${x.n}</button>`).join('')}</div><div class="stk"><div id="stchart"></div><div class="readout" id="strd"></div></div><div class="sl"><label><span>Kurs bei Fälligkeit</span><b id="v_S">${ST.S}</b></label><input type="range" min="0" max="160" step="1" value="${ST.S}" oninput="ST.S=+this.value;$('#v_S').textContent=this.value;stDraw()"></div>${pr.useMin?`<div class="sl"><label><span>Tiefstkurs während der Laufzeit</span><b id="v_m">${ST.min}</b></label><input type="range" min="0" max="100" step="1" value="${ST.min}" oninput="ST.min=+this.value;$('#v_m').textContent=this.value;stDraw()"></div>`:''}${pr.params.map(q=>`<div class="sl"><label><span>${q.l}</span><b id="v_${q.k}">${ST.p[q.k]}</b></label><input type="range" min="${q.min}" max="${q.max}" step="${q.step||1}" value="${ST.p[q.k]}" oninput="ST.p['${q.k}']=+this.value;$('#v_${q.k}').textContent=this.value;stDraw()"></div>`).join('')}<div class="card"><h3>${pr.ic} ${pr.n}</h3><p><b>Markterwartung:</b> ${pr.info.erw}<br><b>Hauptrisiko:</b> ${pr.info.risk}<br><b>Merke:</b> ${pr.info.merk}</p></div></div>`;
  stDraw();
}

/* ============ ARENA ============ */
function vArena(m){
  const nm=Object.keys(S.mist).length;
  m.innerHTML=`<h2 class="sec" style="margin-top:0">⚔️ Arena</h2><div class="grid">
  <div class="tile" style="border-color:var(--gold)" onclick="startSim()"><div class="ic">🏆</div><h4>Klausur-Simulator</h4><p>25 gemischte Fragen · 45 Min · keine Hilfen, Auswertung am Ende</p><div class="meta">Bestwert: ${S.stats.simBest||0} %</div></div>
  <div class="tile" onclick="startBlitz()"><div class="ic">⚡</div><h4>Blitzrunde</h4><p>60 Sekunden – richtig/falsch &amp; Single Choice. Fehler kosten 5 Sekunden.</p><div class="meta">Rekord: ${S.stats.blitzBest||0} Punkte</div></div>
  <div class="tile" onclick="startScen()"><div class="ic">🧑‍💼</div><h4>Beratungsfälle</h4><p>Kundenprofil lesen, passendes Produkt wählen – Geeignetheit üben.</p><div class="meta">${SCEN.length} Fälle</div></div>
  <div class="tile" onclick="startMist()"><div class="ic">🩹</div><h4>Fehlerheft</h4><p>Alle Fragen, die du falsch hattest – bis sie sitzen.</p><div class="meta">${nm} offen</div></div>
  <div class="tile" onclick="startRandom()"><div class="ic">🎲</div><h4>Zufalls-Training</h4><p>10 zufällige Fragen aus allen Einheiten.</p></div></div>`;}
function startSim(){const qs=[];UNITS.forEach(u=>{const pool=shuffle(u.lessons.flatMap(l=>l.qs).filter(q=>q.t!=='nu'));qs.push(...pool.slice(0,2));});const keys=Object.keys(GEN);for(let i=0;i<3;i++)qs.push(GEN[pick(keys)].make());
  showSheet(`<h3>🏆 Klausur-Simulator</h3><p class="muted">${qs.length} Fragen, 45 Minuten, kein Feedback bis zum Ende – wie in der echten Klausur. Danach bekommst du die Auswertung mit Lösungen.</p><button class="btn gold full" id="gosim">Los geht’s</button>`);
  $('#gosim').onclick=()=>{closeSheet();runQs({title:'Klausur-Simulator',qs:shuffle(qs),hearts:null,color:'#ffc800',kind:'sim',noFeedback:true,noRetry:true,timeLimit:45*60});};}
function startScen(){runQs({title:'Beratungsfälle',qs:shuffle(SCEN).slice(0,5).map((q,i)=>Object.assign({},q,{id:'s'+SCEN.indexOf(q)})),hearts:3,color:'#ce82ff',kind:'scen'});}
function startMist(){const ids=Object.keys(S.mist);if(!ids.length){toast('Keine offenen Fehler – stark! 🎉');return;}
  const qs=shuffle(ids).slice(0,10).map(id=>S.mist[id]===1?QMAP[id]:S.mist[id]).filter(Boolean);runQs({title:'Fehlerheft',qs,hearts:null,color:'#ff9600',kind:'mist'});}
function startRandom(){runQs({title:'Zufalls-Training',qs:shuffle(allQs()).slice(0,10),hearts:3,color:'#1cb0f6',kind:'rand'});}
function startBlitz(){
  const pool=shuffle(allQs().filter(q=>q.t==='tf'||q.t==='mc'));let idx=0,score=0,left=60,combo=0,lock=false;
  const draw=()=>{const q=pool[idx%pool.length];const v=q.t==='tf'?{o:['Richtig','Falsch'],ok:q.a?0:1}:(()=>{const o=shuffle(q.o.map((t,i)=>({t,ok:i===0})));return{o:o.map(x=>x.t),ok:o.findIndex(x=>x.ok)};})();
    R.cq={q,v};
    openOv(`<div class="run-top"><button class="x" onclick="closeOv()">✕</button><div class="bar"><i id="bt" style="width:${left/60*100}%;background:var(--blue)"></i></div><span class="tm" id="bts">${left}</span></div><div class="run-body"><div class="run-type">⚡ Blitz · Punkte: <span id="bsc">${score}</span>${combo>=3?' · 🔥 ×'+combo:''}</div><div class="run-q">${esc(q.q)}</div>${v.o.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join('')}</div>`);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const i=+b.dataset.i,ok=i===v.ok;document.querySelectorAll('.opt').forEach((x,k)=>x.classList.add(k===v.ok?'ok':(k===i?'bad':'dim')));
      if(ok){score++;combo++;sfx('ok');}else{combo=0;left=Math.max(0,left-5);sfx('bad');S.mist[q.id]=1;save();}
      setTimeout(()=>{lock=false;idx++;if(R&&left>0)draw();},ok?350:900);});};
  R={kind:'blitz',color:'#1cb0f6'};R.timer=setInterval(()=>{left--;const t=$('#bts');if(t){t.textContent=Math.max(0,left);$('#bt').style.width=Math.max(0,left/60*100)+'%';}if(left<=0){clearInterval(R.timer);endBlitz(score);}},1000);
  draw();}
function endBlitz(score){const best=score>S.stats.blitzBest;S.stats.blitzBest=Math.max(S.stats.blitzBest,score);const xp=score*3;if(xp)addXp(xp);save();confetti();sfx('win');
  const o=ov();openOv(`<div class="run-body"><div class="res"><div class="big">⚡</div><h2>${best?'Neuer Rekord!':'Zeit abgelaufen'}</h2><div class="stats"><div class="stat"><small>Punkte</small><b>${score}</b></div><div class="stat"><small>XP</small><b style="color:var(--gold)">+${xp}</b></div><div class="stat"><small>Rekord</small><b>${S.stats.blitzBest}</b></div></div></div></div><div class="run-foot"><div class="in row"><button class="btn green" style="flex:1" onclick="closeOv()">Weiter</button><button class="btn blue" onclick="R=null;startBlitz()">Nochmal</button></div></div>`);}

function exportProg(){const s=btoa(unescape(encodeURIComponent(JSON.stringify(S))));showSheet(`<h3>📤 Fortschritt sichern</h3><p class="muted">Diesen Code kopieren und auf einem anderen Gerät unter „Wiederherstellen“ einfügen.</p><textarea class="txt" id="exp" rows="5" style="width:100%" readonly>${s}</textarea><button class="btn green full mt" onclick="copyExp()">Kopieren</button>`);}

function importProg(){showSheet(`<h3>📥 Wiederherstellen</h3><textarea class="txt" id="imp" rows="5" style="width:100%" placeholder="Code hier einfügen"></textarea><button class="btn green full mt" onclick="doImport()">Laden</button>`);}

document.addEventListener('keydown',e=>{
  if(ov().classList.contains('hidden')||!R||R.kind==='flash'||R.kind==='blitz')return;
  if(e.key==='Enter'){const n=$('#nxt');if(n){n.click();return;}const c=$('#chk');if(c&&!c.disabled){c.click();}}
  else if(/^[1-9]$/.test(e.key)&&!R.locked&&document.activeElement.tagName!=='INPUT'){const b=document.querySelectorAll('#qbody .opt')[+e.key-1];if(b)b.click();}
});
// Home-Bildschirm-Symbol für iOS (PNG, per Canvas erzeugt)
function setTouchIcon(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#131f24';x.fillRect(0,0,180,180);x.font='110px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🐂',90,98);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);}catch(e){}}
function boot(){
  setTouchIcon();
  render();
  if(!S.intro){S.intro=true;save();showSheet(`<h3>🐂 Willkommen bei Bulle &amp; Bär!</h3><p>Dein Trainer für <b>Anlageprodukte &amp; Anlageberatung</b>: Lernpfad mit ${totalLessons()} Lektionen, Karteikarten, Rechen-Lab, Payoff-Studio, Beratungsfällen und Klausur-Simulator. Sammle XP, halte deine Serie und werde Vorstand!</p><label class="muted">Wie heißt du?</label><input class="txt" id="nm" value="${esc(S.name)}"><button class="btn green full" onclick="S.name=$('#nm').value.trim()||'Eric';save();closeSheet();render()">Los geht’s!</button>`);}
  setInterval(renderHud,60000);
}
boot();
</script>
